version: '3.8'

services:
  # Backend API (uses Firestore as database — no local DB needed)
  backend:
    build:
      context: ./city-event/backend
      dockerfile: Dockerfile
    container_name: cityevent-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,http://frontend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    networks:
      - cityevent
    restart: unless-stopped

  # Frontend (served by nginx)
  frontend:
    build:
      context: ./city-event/frontend
      dockerfile: Dockerfile
    container_name: cityevent-web
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "80:80"
    networks:
      - cityevent
    restart: unless-stopped

volumes:
  uploads:

networks:
  cityevent:
    driver: bridge
